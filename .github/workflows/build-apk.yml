name: Build Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Replace default Capacitor icon with the real Darkroom logo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          # Remove the adaptive-icon definition so Android falls back to the plain
          # per-density icons below on every Android version, instead of showing
          # Capacitor's default adaptive icon layers.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert www/icon-512.png -resize ${size}x${size} "$dir/ic_launcher.png"
            convert www/icon-512.png -resize ${size}x${size} "$dir/ic_launcher_round.png"
            convert www/icon-512.png -resize ${size}x${size} "$dir/ic_launcher_foreground.png"
          done

      - name: Allow saving files to the public Downloads folder
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application\n        android:requestLegacyExternalStorage="true"/' "$MANIFEST"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' "$MANIFEST"

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: darkroom-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Bundle libraries locally (so the app never needs internet to load them)
        run: |
          mkdir -p www/libs
          curl -sL -o www/libs/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          curl -sL -o www/libs/pdf-lib.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js
          curl -sL -o www/libs/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -sL -o www/libs/pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
          curl -sL -o www/libs/mammoth.browser.min.js https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js
          curl -sL -o www/libs/html2canvas.min.js https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js
          curl -sL -o www/libs/docx.umd.js https://cdnjs.cloudflare.com/ajax/libs/docx/8.2.3/index.umd.js
          curl -sL -o www/libs/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js
          echo "Downloaded files:"
          ls -la www/libs/
          for f in www/libs/*.js; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing â€” download failed."
              exit 1
            fi
          done

      - name: Add Android platform
        run: npx cap add android

      - name: Replace default Capacitor icon with the real Darkroom logo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          # Remove the adaptive-icon definition so Android falls back to the plain
          # per-density icons below on every Android version, instead of showing
          # Capacitor's default adaptive icon layers.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert www/icon-512.png -resize ${size}x${size} "$dir/ic_launcher.png"
            convert www/icon-512.png -resize ${size}x${size} "$dir/ic_launcher_round.png"
            convert www/icon-512.png -resize ${size}x${size} "$dir/ic_launcher_foreground.png"
          done

      - name: Replace splash screen with Darkroom logo
        run: |
          for f in $(find android/app/src/main/res -name "splash.png"); do
            dims=$(identify -format "%wx%h" "$f")
            convert www/icon-512.png -resize 42% -gravity center -background "#FBF7F0" -extent "$dims" "$f"
          done

      - name: Allow saving files to the public Downloads folder
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application\n        android:requestLegacyExternalStorage="true"/' "$MANIFEST"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' "$MANIFEST"

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: darkroom-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
